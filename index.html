<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTP TECH AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px Arial;background:#f3f6f8;color:#18252c}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;max-width:1200px;margin:auto;background:#fff}
.sidebar{width:270px;background:#102b27;color:white;padding:18px;display:flex;flex-direction:column;gap:12px}
.brand{font-size:21px;font-weight:bold;color:#7de0b2;padding:8px 0}
.sub{font-size:13px;color:#bdd2cc}
.btn{border:0;border-radius:10px;padding:11px 13px}
.new{background:#176d51;color:white;border:1px solid #428a70}
.list{overflow:auto;flex:1}
.item{display:flex;align-items:center;gap:6px;margin:5px 0}
.pick{flex:1;min-width:0;text-align:left;background:transparent;color:#e1eee9;border:0;border-radius:8px;padding:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.active,.pick:hover{background:#24463e}
.del{background:transparent;color:#b8c9c3;border:0;padding:7px}
.memory{border-top:1px solid #35544c;padding-top:13px}
.memory label{font-size:13px;font-weight:bold}
.memory textarea{width:100%;height:75px;margin-top:8px;padding:9px;border-radius:8px;border:1px solid #547067;resize:vertical;background:#183a32;color:white}
.save{background:#d7f7e7;color:#164d3a;width:100%;margin-top:6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header{padding:18px 22px;border-bottom:1px solid #e5ece8;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h2{font-size:19px;margin:0 0 5px}
.status{font-size:12px;color:#16815b}
#chat{flex:1;overflow:auto;padding:24px max(16px,calc((100% - 720px)/2))}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;padding:13px 16px;border-radius:15px;margin:12px 0;max-width:90%}
.bot{background:#f0f5f2;margin-right:auto}
.user{background:#d9f7e8;margin-left:auto}
.welcome{text-align:center;padding:8vh 10px 20px}
.welcome h1{font-size:27px}
.welcome p{color:#65756e;line-height:1.6}
form{display:flex;gap:10px;padding:14px max(14px,calc((100% - 760px)/2));border-top:1px solid #e5ece8}
input{flex:1;min-width:0;border:1px solid #cbd8d1;border-radius:13px;padding:14px;font-size:16px}
.send{border:0;border-radius:12px;background:#087f5b;color:white;padding:0 20px}
.send:disabled{opacity:.5}
.note{text-align:center;color:#78857e;font-size:11px;padding:0 8px 10px}
@media(max-width:650px){
 .sidebar{width:72px;padding:10px 6px;align-items:center}
 .brand{font-size:11px;text-align:center;overflow-wrap:anywhere}
 .sub,.new span,.memory{display:none}
 .new{font-size:20px;padding:10px}
 .list{width:100%}
 .item{justify-content:center}
 .pick{font-size:0;text-align:center;padding:12px 0}
 .pick:before{content:"▤";font-size:18px}
 .del{display:none}
 header{padding:14px}
 #chat{padding:14px}
 .msg{max-width:96%}
 .send{padding:0 14px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar">
  <div class="brand">BTP TECH AI</div>
  <div class="sub">Trợ lý AI cá nhân</div>
  <button class="btn new" id="newChat">＋ <span>Cuộc trò chuyện mới</span></button>
  <div class="list" id="chatList"></div>
  <section class="memory">
   <label for="memory">🧠 Bộ nhớ cá nhân</label>
   <textarea id="memory" placeholder="Ví dụ: Tôi làm camera, điện mặt trời tại BTP TECH..."></textarea>
   <button class="btn save" id="saveMemory">Lưu bộ nhớ</button>
  </section>
 </aside>

 <main class="main">
  <header>
   <div>
    <h2 id="title">Trợ lý AI</h2>
    <div class="status">● Sẵn sàng trò chuyện</div>
   </div>
  </header>
  <div id="chat">
   <div class="welcome">
    <h1>Xin chào anh 👋</h1>
    <p>Em là trợ lý AI cá nhân của anh.<br>Hãy nhập câu hỏi để bắt đầu.</p>
   </div>
  </div>
  <form id="form">
   <input id="message" placeholder="Nhập câu hỏi của anh..." autocomplete="off" required>
   <button class="send" id="send">Gửi ➤</button>
  </form>
  <div class="note">AI có thể trả lời chưa chính xác. Anh nên kiểm tra thông tin quan trọng.</div>
 </main>
</div>

<script>
const API_URL="https://btptech.nguyenbinh1190.workers.dev/";
const $=id=>document.getElementById(id);
const STORE="btptech_ai_chats_v1";
const MEM="btptech_ai_memory_v1";
let chats=[];
let currentId=null;

try{chats=JSON.parse(localStorage.getItem(STORE)||"[]")}catch{chats=[]}
if(!Array.isArray(chats))chats=[];
let memory=localStorage.getItem(MEM)||"";
$("memory").value=memory;

function persist(){
 try{localStorage.setItem(STORE,JSON.stringify(chats))}
 catch{alert("Bộ nhớ trình duyệt đầy. Anh hãy xóa bớt cuộc trò chuyện cũ.")}
}
function current(){return chats.find(c=>c.id===currentId)}
function newConversation(){
 const c={id:String(Date.now())+Math.random().toString(16).slice(2),title:"Cuộc trò chuyện mới",messages:[]};
 chats.unshift(c);currentId=c.id;persist();render();
 $("message").focus();
}
function render(){
 const c=current();
 $("title").textContent=c?.title||"Trợ lý AI";
 $("chatList").innerHTML="";
 chats.forEach(item=>{
  const row=document.createElement("div");row.className="item";
  const pick=document.createElement("button");
  pick.className="pick"+(item.id===currentId?" active":"");
  pick.textContent=item.title;pick.title=item.title;
  pick.onclick=()=>{currentId=item.id;render()};
  const del=document.createElement("button");del.className="del";del.textContent="×";del.title="Xóa cuộc trò chuyện";
  del.onclick=()=>{
   if(!confirm("Xóa cuộc trò chuyện này?"))return;
   chats=chats.filter(x=>x.id!==item.id);
   if(currentId===item.id)currentId=chats[0]?.id||null;
   persist();render();
  };
  row.append(pick,del);$("chatList").append(row);
 });
 const area=$("chat");area.innerHTML="";
 if(!c||!c.messages.length){
  const welcome=document.createElement("div");welcome.className="welcome";
  welcome.innerHTML="<h1>Xin chào anh 👋</h1><p>Em là trợ lý AI cá nhân của anh.<br>Hãy nhập câu hỏi để bắt đầu.</p>";
  area.append(welcome);return;
 }
 c.messages.forEach(m=>{
  const div=document.createElement("div");
  div.className="msg "+(m.role==="user"?"user":"bot");
  div.textContent=m.content;area.append(div);
 });
 area.scrollTop=area.scrollHeight;
}
$("newChat").onclick=newConversation;
$("saveMemory").onclick=()=>{
 memory=$("memory").value.trim();
 localStorage.setItem(MEM,memory);
 alert("Đã lưu bộ nhớ trên trình duyệt này.");
};
$("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const text=$("message").value.trim();
 if(!text)return;
 if(!current())newConversation();
 const c=current();
 c.messages.push({role:"user",content:text});
 if(c.messages.length===1)c.title=text.slice(0,36)+(text.length>36?"…":"");
 $("message").value="";persist();render();
 const waiting=document.createElement("div");
 waiting.className="msg bot";waiting.textContent="Em đang suy nghĩ...";
 $("chat").append(waiting);$("chat").scrollTop=$("chat").scrollHeight;
 $("send").disabled=true;
 try{
  const response=await fetch(API_URL,{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:text,
    history:c.messages.slice(0,-1).slice(-20),
    memory:memory
   })
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.detail||data.error||"Lỗi HTTP "+response.status);
  const reply=data.reply||"AI chưa trả về nội dung.";
  c.messages.push({role:"assistant",content:reply});
  waiting.textContent=reply;persist();render();
 }catch(err){
  waiting.textContent="Chưa kết nối được AI: "+err.message;
  $("chat").scrollTop=$("chat").scrollHeight;
 }finally{$("send").disabled=false;$("message").focus()}
});
if(chats.length){currentId=chats[0].id}
else{newConversation()}
render();
</script>
</body>
</html>
