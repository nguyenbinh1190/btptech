      padding: 0 18px;
      border: 0;
      border-radius: 12px;

      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h2>BTP TECH AI</h2>
      <p>Trợ lý AI cá nhân của anh</p>
    </header>

    <main id="chat">
      <div class="msg bot">Xin chào anh! Em có thể giúp gì cho anh hôm nay?</div>
    </main>

    <form id="form">
      <input id="message" placeholder="Nhập câu hỏi..." autocomplete="off" required>
      <button id="send" type="submit">Gửi</button>
    </form>
  </div>

  <script>
    const API_URL = "https://btptech.nguyenbinh1190.workers.dev/";
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      const waiting = addMessage("Em đang suy nghĩ...", "bot");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.detail || data.error || "Lỗi HTTP " + response.status
          );
        }

        waiting.textContent = data.reply || "AI chưa trả về nội dung.";
      } catch (error) {
        waiting.textContent = "Chưa kết nối được AI: " + error.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
